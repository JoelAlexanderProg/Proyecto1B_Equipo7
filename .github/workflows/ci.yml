name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  calidad-y-pruebas:
    name: Ruff y pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Análisis estático con Ruff
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Pruebas con cobertura
        run: pytest --cov --cov-report=term --cov-report=xml
      - name: Guardar el reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml

  imagen-docker:
    name: Construcción de la imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t cafeteria-app:ci .
