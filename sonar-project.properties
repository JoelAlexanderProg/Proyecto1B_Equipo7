# Análisis estático con SonarQube (ver docs/05-analisis-estatico en la rama documentacion).
sonar.projectKey=cafepoli
sonar.projectName=CaféPoli
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/static/fonts/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=reporte-pruebas.xml
# El JavaScript es mejora progresiva (total en vivo y recarga); el servidor valida todas las
# reglas. Se verifica con el caso manual CT-M01 y no tiene pruebas automáticas en el Release 1.0.
sonar.coverage.exclusions=src/cafeteria/presentacion/static/js/**
